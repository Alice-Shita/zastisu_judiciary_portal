{% extends "judiciary_layout.html" %}

{% block title %}

Login

{% endblock %}

{% block content %}

<div class="card">

<h2>

Applicant Login

</h2>

<p class="subtitle">

Sign in using your assigned Judiciary Applicant ID.

</p>

<form method="POST">

<input
type="text"
name="id"
placeholder="Applicant ID"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

{% with messages = get_flashed_messages() %}

{% if messages %}

<div class="error-box">

{{ messages[0] }}

</div>

{% endif %}

{% endwith %}

</div>

{% endblock %}
